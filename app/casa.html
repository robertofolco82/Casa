<title>Casa Raviola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════ TOKEN ═══════════════ */
:root{
  --bg:#FBF9F6; --surface:#FFFFFF; --sand:#F4EEE7; --sand2:#EBE2D7;
  --line:#E3DACF; --line2:#F0E9E1;
  --ink:#1E1B18; --ink2:#574F47; --muted:#8E8377;
  --accent:#8A6A4B; --accent-soft:#EFE4D7;
  --green:#3C4A3E; --green-soft:#E3E8E1;
  --gold:#A98A55; --danger:#96382C; --danger-soft:#F5E4E0;
  --shadow:0 1px 2px rgba(30,27,24,.04),0 8px 28px rgba(30,27,24,.06);
  --shadow-lg:0 2px 6px rgba(30,27,24,.06),0 24px 60px rgba(30,27,24,.14);
  --fd:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --fs:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:2px;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14120F; --surface:#1B1815; --sand:#221E1A; --sand2:#2A251F;
    --line:#332C25; --line2:#251F1A;
    --ink:#F3EEE7; --ink2:#C3B9AC; --muted:#8F857A;
    --accent:#C79E72; --accent-soft:#2C241C;
    --green:#A8C0A8; --green-soft:#1E251E;
    --gold:#C7A96B; --danger:#D98876; --danger-soft:#2E1C18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#14120F; --surface:#1B1815; --sand:#221E1A; --sand2:#2A251F;
  --line:#332C25; --line2:#251F1A;
  --ink:#F3EEE7; --ink2:#C3B9AC; --muted:#8F857A;
  --accent:#C79E72; --accent-soft:#2C241C;
  --green:#A8C0A8; --green-soft:#1E251E;
  --gold:#C7A96B; --danger:#D98876; --danger-soft:#2E1C18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);font-weight:300;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-weight:400;letter-spacing:-.01em}
p{margin:0 0 .8em}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;width:100%;transition:border-color .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
select{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
::placeholder{color:var(--muted);opacity:1}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* ═══════════════ TIPOGRAFIA ═══════════════ */
.serif{font-family:var(--fd)}
.display{font-family:var(--fd);font-weight:300;line-height:1.08;letter-spacing:-.015em}
.micro{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.micro-ink{color:var(--ink)}
.lead{font-size:16px;color:var(--ink2);font-weight:300}
.small{font-size:13px;color:var(--ink2)}
.tiny{font-size:11.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ═══════════════ LAYOUT ═══════════════ */
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.stack>*+*{margin-top:var(--gap,16px)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-tight{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec{padding:64px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:28px}

/* ═══════════════ HEADER ═══════════════ */
header.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:0 28px}
.top-r1{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 14px}
.mark{font-family:var(--fd);font-weight:300;font-size:27px;letter-spacing:.26em;
  text-transform:uppercase;line-height:1;white-space:nowrap}
.mark small{display:block;font-family:var(--fs);font-size:8.5px;letter-spacing:.32em;
  color:var(--muted);margin-top:5px;font-weight:400}
.top-icons{display:flex;align-items:center;gap:4px}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;background:none;border:0;
  cursor:pointer;color:var(--ink);border-radius:50%;transition:background .15s;position:relative}
.iconbtn:hover{background:var(--sand)}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
nav.main{display:flex;gap:30px;padding-bottom:14px;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;
  color:var(--ink2);padding-bottom:5px;border-bottom:1.5px solid transparent;white-space:nowrap;transition:.15s}
nav.main a:hover{color:var(--ink)}
nav.main a.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

/* ═══════════════ BOTTONI ═══════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 26px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  border-radius:var(--r);cursor:pointer;transition:.16s;white-space:nowrap}
.btn:hover{opacity:.84}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1;background:var(--sand)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:8px 16px;font-size:10.5px;letter-spacing:.14em}
.btn.xs{padding:5px 11px;font-size:10px;letter-spacing:.1em}
.btn.wide{width:100%}
.link{background:none;border:0;padding:0;cursor:pointer;font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:500;color:var(--ink);border-bottom:1px solid var(--line);
  padding-bottom:2px;transition:.15s}
.link:hover{border-bottom-color:var(--ink)}
.link.q{font-size:12px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--accent);border-bottom-color:currentColor}

/* ═══════════════ CHIP / TAG ═══════════════ */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line);
  border-radius:100px;font-size:11px;letter-spacing:.06em;background:var(--surface);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.soft{background:var(--sand);border-color:transparent;color:var(--ink2)}
.chip button{background:none;border:0;padding:0;cursor:pointer;opacity:.5;font-size:13px;line-height:1}
.chip button:hover{opacity:1}
.chip.pick{cursor:pointer}
.badge{display:inline-block;padding:3px 9px;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:500;border-radius:100px}
.badge.b-att{background:var(--sand2);color:var(--ink2)}
.badge.b-cor{background:var(--accent-soft);color:var(--accent)}
.badge.b-fat{background:var(--green-soft);color:var(--green)}
.badge.b-acq{background:var(--ink);color:var(--bg)}
.badge.b-err{background:var(--danger-soft);color:var(--danger)}

/* ═══════════════ CARD ═══════════════ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.flat{border-color:var(--line2)}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.sidebar-layout{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start}

/* card benchmark */
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.bcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.bcard .art{aspect-ratio:4/3;background:var(--sand);display:grid;place-items:center;
  border-bottom:1px solid var(--line2);position:relative}
.bcard .art svg{width:52%;height:52%;opacity:.5}
.bcard .body{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;gap:6px}
.bcard .fav{position:absolute;top:10px;right:10px;font-size:15px;color:var(--accent)}

/* ═══════════════ HERO ═══════════════ */
.hero{position:relative;overflow:hidden;background:var(--sand);border-bottom:1px solid var(--line)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero-img-d{object-position:52% 54%}
.hero-img-m{display:none;object-position:50% 62%}
.hero-scrim{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to top,rgba(18,15,12,.84) 0%,rgba(18,15,12,.56) 30%,rgba(18,15,12,.20) 60%,rgba(18,15,12,0) 90%),
  linear-gradient(to right,rgba(18,15,12,.56) 0%,rgba(18,15,12,.22) 40%,rgba(18,15,12,0) 68%)}
.hero-in{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:130px 28px 88px;
  min-height:clamp(440px,66vh,700px);display:flex;flex-direction:column;justify-content:flex-end}
.hero .kick{color:rgba(255,255,255,.92);margin-bottom:18px;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.hero h1{font-size:clamp(38px,6.4vw,70px);color:#fff;text-shadow:0 2px 28px rgba(0,0,0,.34)}
.hero .lead{color:rgba(255,255,255,.90);max-width:530px;margin-top:16px;
  text-shadow:0 1px 18px rgba(0,0,0,.3)}

/* il lanciatore galleggia sul bordo inferiore della foto */
.launcher-card{position:relative;z-index:3;margin-top:-56px;margin-bottom:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 28px 24px;box-shadow:var(--shadow-lg)}
.launcher{max-width:none;margin-top:0}
.launcher .bar{display:flex;gap:0;border:1px solid var(--ink);background:var(--surface);border-radius:var(--r)}
.launcher .bar input{border:0;padding:17px 20px;background:transparent;font-size:16px}
.launcher .bar input:focus{outline:none}
.launcher .bar .btn{border-radius:0;border:0;padding-left:30px;padding-right:30px}
.opts{margin-top:18px;display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.radio{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink2)}
.radio i{width:13px;height:13px;border:1.5px solid var(--muted);border-radius:50%;display:inline-block;position:relative}
.radio.on i{border-color:var(--ink)}
.radio.on i::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--ink)}
.radio.on{color:var(--ink)}
.launcher-more{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}

/* ═══════════════ TABELLA ═══════════════ */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:middle}
thead th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  color:var(--muted);background:var(--sand);border-bottom:1px solid var(--line);
  white-space:nowrap;position:sticky;top:0;z-index:2}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
tbody tr{transition:background .12s}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--sand)}
tbody tr:last-child td{border-bottom:0}
td.best{background:var(--green-soft);font-weight:500}
.rank{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;
  background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:500}
.rank.r2{background:var(--muted)}
.rank.r3{background:var(--sand2);color:var(--ink2)}
.rank.rx{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* tabella comparativa benchmark */
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;background:var(--surface);
  z-index:1;width:186px;min-width:186px;max-width:186px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cmp thead th:first-child{background:var(--sand);z-index:3}
.cmp th,.cmp td{min-width:150px}
.cmp .cand-head{font-family:var(--fd);font-size:17px;letter-spacing:0;text-transform:none;
  color:var(--ink);font-weight:400;line-height:1.25}
.score-bar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:5px}
.score-bar i{display:block;height:100%;background:var(--accent)}

/* ═══════════════ LISTE ═══════════════ */
.lrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.lrow:last-child{border-bottom:0}
.folder{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
  border-radius:var(--r);cursor:pointer;transition:.14s;font-size:13.5px}
.folder:hover{background:var(--sand)}
.folder.on{background:var(--ink);color:var(--bg)}
.folder.on .tiny{color:var(--bg);opacity:.6}

/* ═══════════════ DROPZONE ═══════════════ */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:40px 24px;text-align:center;
  background:var(--sand);transition:.18s;cursor:pointer}
.drop:hover,.drop.hot{border-color:var(--accent);background:var(--accent-soft)}

/* ═══════════════ CHAT ═══════════════ */
.chat{display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sand)}
.chat-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.chat-foot{border-top:1px solid var(--line);padding:12px 14px;background:var(--surface)}
.chat-foot .row{align-items:flex-end}
.msg{max-width:88%;font-size:14px;line-height:1.6}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px 12px 3px 12px}
.msg.ai{align-self:flex-start;color:var(--ink)}
.msg.ai .who{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.msg.err{align-self:flex-start;background:var(--danger-soft);color:var(--danger);
  padding:10px 14px;border-radius:3px;font-size:13px}
.msg p:last-child{margin-bottom:0}
.msg ul{margin:.4em 0;padding-left:1.1em}
.msg code{background:var(--sand);padding:1px 5px;border-radius:2px;font-size:12.5px}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:12.5px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.chat-embed{height:460px}

/* overlay chat */
.fab{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;align-items:center;gap:9px;
  padding:14px 22px;background:var(--ink);color:var(--bg);border:0;border-radius:100px;
  cursor:pointer;box-shadow:var(--shadow-lg);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500}
.fab:hover{opacity:.9}
.overlay-chat{position:fixed;right:22px;bottom:22px;z-index:81;width:430px;height:min(74vh,660px);
  box-shadow:var(--shadow-lg);border-radius:var(--r)}

/* ═══════════════ MODALE ═══════════════ */
.scrim{position:fixed;inset:0;background:rgba(20,17,14,.44);z-index:90;
  display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r);width:min(660px,100%);
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
.modal-body{padding:24px}

/* ═══════════════ VARIE ═══════════════ */
.field{display:block}
.field>span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:500;color:var(--muted);margin-bottom:6px}
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty svg{opacity:.35;margin-bottom:14px}
.note{background:var(--sand);border-left:2px solid var(--accent);padding:12px 16px;font-size:13px;color:var(--ink2)}
.note.warn{background:var(--danger-soft);border-left-color:var(--danger);color:var(--danger)}
.meter{height:6px;background:var(--sand2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);transition:width .4s}
.meter i.over{background:var(--danger)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:120;
  background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:100px;
  font-size:12.5px;box-shadow:var(--shadow-lg);animation:up .25s ease-out}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.spin{display:inline-block;width:13px;height:13px;border:1.5px solid currentColor;
  border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sep{color:var(--line);margin:0 8px}
.hide{display:none!important}

/* ═══════════════ RESPONSIVE ═══════════════ */
@media(max-width:1000px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .sidebar-layout{grid-template-columns:1fr;gap:22px}
}
@media(max-width:760px){
  body{font-size:14.5px}
  .wrap,.top-in,.hero-in{padding-left:18px;padding-right:18px}
  .sec{padding:40px 0}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .mark{font-size:21px;letter-spacing:.2em}
  nav.main{gap:20px}
  .hero-in{padding:96px 18px 60px;min-height:clamp(480px,74vh,640px)}
  .hero-img-d{display:none}
  .hero-img-m{display:block}
  .hero .lead{font-size:15px}
  .launcher-card{margin-top:-34px;padding:18px}
  .launcher .bar{flex-direction:column}
  .launcher .bar input{border-bottom:1px solid var(--line)}
  .launcher .bar .btn{border-radius:0;width:100%;padding:14px}
  .launcher-more{grid-template-columns:1fr}
  .overlay-chat{right:0;left:0;bottom:0;width:auto;height:86vh;border-radius:12px 12px 0 0}
  .fab{right:16px;bottom:16px;padding:13px 19px}
  .modal{max-height:94vh}
  .modal-body{padding:18px}
  .cmp th,.cmp td{min-width:132px}
  .card{padding:17px}
}
@media(max-width:520px){
  .cmp th:first-child,.cmp td:first-child{min-width:118px}
}
</style>

<header class="top">
  <div class="top-in">
    <div class="top-r1">
      <a href="#/" class="mark">Casa<small>Via Raviola 32 · Mezzocammino</small></a>
      <div class="top-icons">
        <button class="iconbtn" data-act="go" data-route="benchmark?fav=1" title="Preferiti" aria-label="Preferiti">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 20.5s-7.5-4.7-7.5-10A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.9c0 5.3-7.5 10-7.5 10z"/></svg>
        </button>
        <button class="iconbtn" data-act="toggle-theme" title="Tema" aria-label="Tema">

async function sha256(buf){
  try{const h=await crypto.subtle.digest("SHA-256",buf);
    return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,32);
  }catch{ return "h"+buf.byteLength+"-"+uid() }
}

function md(t){

  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");

/* ════════════════════════════════════════════════════════════════════════
   STORE — adattatore dati. Tre backend possibili, una sola interfaccia.
   fase 1: 'db' (server dell'artifact) con fallback 'local' (browser)
   fase 2: 'supabase' — stessi metodi, stessi path, viste invariate
   ════════════════════════════════════════════════════════════════════════ */
const Store={
  backend:"local", db:null, _lsPrefix:"casa:",

  async init(){
    try{
      const db=await window.claude?.use?.("db");
      if(db){ this.db=db; this.backend="db"; return "db" }
    }catch(e){ console.warn("db non disponibile:",e?.code||e) }
    this.backend="local"; return "local";
  },
  /* ---- documento singolo ---- */
  async get(path){
    if(this.backend==="db"){
      try{ const s=await this.db.doc(path).get(); return s.exists?s.data():null }
      catch(e){ this._err(e); return null }
    }
    const r=localStorage.getItem(this._lsPrefix+path);
    return r?JSON.parse(r):null;
  },
  async set(path,data){
    const body={...data,_agg:new Date().toISOString()};
    if(this.backend==="db"){
      try{ await this.db.doc(path).set(body); return true }catch(e){ this._err(e); return false }
    }
    try{ localStorage.setItem(this._lsPrefix+path,JSON.stringify(body)); this._index(path,1); return true }
    catch(e){ toast("Spazio del browser esaurito"); return false }
  },
  async del(path){
    if(this.backend==="db"){
      try{ await this.db.doc(path).delete(); return true }catch(e){ this._err(e); return false }
    }
    localStorage.removeItem(this._lsPrefix+path); this._index(path,-1); return true;
  },
  /* ---- collection ---- */
  async list(col){
    if(this.backend==="db"){
      try{
        const s=await this.db.collection(col).get();
        return s.docs.map(d=>({id:d.id,...d.data()}));
      }catch(e){ this._err(e); return [] }
    }
    const out=[]; const pre=this._lsPrefix+col+"/";
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith(pre)&&k.slice(pre.length).indexOf("/")===-1){
        try{ out.push({id:k.slice(pre.length),...JSON.parse(localStorage.getItem(k))}) }catch{}
      }
    }
    return out;
  },
  _index(){/* il backend locale enumera direttamente le chiavi */},
  _err(e){
    const c=e?.code;
    if(c==="quota_exceeded") toast("Archivio pieno: elimina qualche elemento");
    else if(c==="resource_exhausted") toast("Troppe operazioni, riprova fra poco");
    else if(c==="revoked") toast("Accesso all'archivio revocato");
    else console.warn("store:",c||e);
  },
};

/* ════════════════════════════════════════════════════════════════════════
   DRIVE — l'ibrido che chiedeva Roberto.

   La pagina NON può chiamare Google Drive via rete: la CSP la blocca.
   Ma può chiamare i CONNETTORI di chi guarda attraverso il runtime di
   Claude: non è una richiesta di rete, è un ponte. Verificato in sessione:
   creazione cartelle, upload di PDF binario, spostamento, rilettura.

   Il file originale finisce nel Drive di Roberto. L'app tiene la scheda,
   l'id e il link. I due archivi restano allineati.
   ════════════════════════════════════════════════════════════════════════ */
const LIMITE_DRIVE = 4 * 1024 * 1024;   /* oltre, il payload base64 diventa fragile */

function base64Da(buf){
  const u = new Uint8Array(buf); let s = ""; const passo = 0x8000;
  for(let i=0;i<u.length;i+=passo) s += String.fromCharCode.apply(null, u.subarray(i, i+passo));
  return btoa(s);
}

const Drive = {
  mcp:null, mappa:null, stato:"non-disponibile", ultimoErrore:null,

  async init(){
    try{ this.mcp = await window.claude?.use?.("mcp") }catch{ this.mcp = null }
    this.mappa = await Store.get("app/drive");
    this.stato = !this.mcp ? "non-disponibile"
               : !this.mappa?.cartelle ? "senza-cartelle"
               : "pronto";
    return this.stato;
  },
  attivo(){ return this.stato === "pronto" },
  cartellaId(idApp){ return this.mappa?.cartelle?.[idApp] || this.mappa?.radice || null },

  /* branch per codice: ogni errore ha una via d'uscita diversa */
  copia(e){
    const c = e?.code;
    return {
      not_granted:"Devi consentire a questa pagina di usare il tuo Google Drive.",
      approval_required:"Il caricamento su Drive è in attesa della tua approvazione.",
      server_not_connected:"Google Drive non è collegato al tuo account claude.ai: aggiungilo fra i connettori.",
      needs_reauth:"L'accesso a Google Drive è scaduto: ricollegalo dalle impostazioni di claude.ai.",
      not_in_manifest:"Questa versione dell'app non ha accesso a quello strumento di Drive.",
      blocked_by_policy:"Una policy blocca l'accesso a Drive.",
      server_unavailable:"Drive non risponde in questo momento. Il file resta indicizzato qui: riprova più tardi.",
      upstream_error:"Drive ha risposto con un errore. Il file resta indicizzato qui.",
      rate_limited:"Troppe richieste a Drive di seguito: aspetta qualche secondo.",
      tool_error:"Drive ha rifiutato l'operazione: " + (e?.message || "motivo non riportato"),
      cancelled:"Caricamento su Drive annullato.",
    }[c] || ("Drive non raggiungibile" + (c ? " (" + c + ")" : "") + ".");
  },

  async carica(file, buf, idCartellaApp){
    if(!this.attivo()) return null;
    if(file.size > LIMITE_DRIVE)
      return {errore:"Oltre 4 MB: caricalo a mano nella cartella del progetto su Drive."};
    const parentId = this.cartellaId(idCartellaApp);
    if(!parentId) return {errore:"Cartella di destinazione non configurata su Drive."};
    try{
      const r = await this.mcp.callTool(this.mappa.connettore || "Google Drive", "create_file", {
        title:file.name, parentId,
        contentMimeType:file.type || "application/octet-stream",
        disableConversionToGoogleType:true,
        base64Content:base64Da(buf),
      });
      const p = r?.payload || {};
      if(!p.id) return {errore:"Drive non ha restituito l'identificativo del file."};
      this.ultimoErrore = null;
      return {id:p.id, url:p.viewUrl || "", dim:p.fileSize};
    }catch(e){
      /* una scrittura fallita è ambigua: non ritento da solo */
      this.ultimoErrore = e?.code || "sconosciuto";
      return {errore:this.copia(e)};
    }
  },

  async sposta(fileId, idCartellaApp){
    if(!this.attivo() || !fileId) return null;
    const parentId = this.cartellaId(idCartellaApp);
    if(!parentId) return {errore:"Cartella non configurata su Drive."};
    try{
      const r = await this.mcp.callTool(this.mappa.connettore || "Google Drive", "update_file",
        {fileId, parentId});
      return {id:r?.payload?.id || fileId};
    }catch(e){ return {errore:this.copia(e)} }
  },
};

/* ─────────── calcoli di dominio ─────────── */
function punteggio(c,pesi=S.cfg.pesi){
  let n=0,d=0;
  for(const {k} of CRITERI){
    const v=c.punteggi?.[k];
    if(v==null||v==="") continue;
    const w=Number(pesi[k]??1); n+=Number(v)*w; d+=w;
  }
  return d?n/d:null;
}
function tco(c){
  const p=num(c.prezzo)||0, anni=num(c.tco?.anniVita)||10;
  const kwh=(num(c.tco?.kwhAnno)||0)*(num(c.tco?.costoKwh)||0.25);
  const cons=num(c.tco?.consumabiliAnno)||0;
  return Math.round(p+(kwh+cons)*anni);
}
function classifica(b){
  const cands=(b.candidati||[]).map(c=>({...c,_p:punteggio(c),_tco:tco(c)}));
  return sortBy(cands,"_p",-1);
}
function vincitore(b){ return classifica(b)[0]||null }
function nomiAmbienti(ids){
  return (ids||[]).map(i=>byId(S.ambienti,i)?.nome||i).join(", ");
}
function prodottiDiAmbiente(id){
  const out=[];
  for(const b of S.benchmarks){
    if(!(b.ambienti||[]).includes(id)) continue;
    const v=vincitore(b);
    out.push({b,v});
  }
  return out;
}
function speseTotali(){
  let tot=0,bonus=0;
  for(const b of S.benchmarks) for(const c of (b.candidati||[])){
    if(!c.acquistato) continue;
    const p=num(c.prezzoPagato)??num(c.prezzo)??0;
    tot+=p; if(b.bonusMobili) bonus+=p;
  }
  return {tot,bonus};
}

const SEZIONI=[
  {r:"home",l:"Home"},
  {r:"benchmark",l:"I tuoi benchmark"},
  {r:"ambienti",l:"Ambienti"},
  {r:"acquisti",l:"Acquisti"},
  {r:"documenti",l:"Documentazione"},
];

function leggiHash(){
  const h=(location.hash||"#/").replace(/^#\/?/,"");
  const [path,qs]=h.split("?");
  const seg=path.split("/").filter(Boolean);
  const q=Object.fromEntries(new URLSearchParams(qs||""));
  if(!seg.length) return {n:"home",q};
  if(seg[0]==="b"&&seg[1]) return {n:"bench",id:seg[1],q};
  return {n:seg[0],q};
}
function vai(route){ location.hash="#/"+route.replace(/^\/+/,"") }

function renderNav(){
  const cur=S.ui.route.n;
  const on=r=>(r===cur||(r==="benchmark"&&cur==="bench"))?"on":"";
  $("#nav").innerHTML=SEZIONI.map(s=>
    `<a href="#/${s.r}" class="${on(s.r)}">${s.l}</a>`).join("");
}

function render(){
  renderNav();
  const v=$("#view"); const r=S.ui.route;
  const viste={home:vHome,benchmark:vElenco,bench:vDettaglio,ambienti:vAmbienti,
    acquisti:vAcquisti,documenti:vDocumenti,impostazioni:vImpostazioni};
  const f=viste[r.n]||vHome;
  v.innerHTML=f(r);
  window.scrollTo({top:0,behavior:"instant"});
  renderChat();
}

window.addEventListener("hashchange",()=>{
  S.ui.route=leggiHash();
  if(S.ui.route.q?.fav) S.ui.filtro.fav=true;
  render();
});

function cardBench(b){
  const v=vincitore(b); const st=STATI[b.stato]||STATI.bozza;
  const fav=(b.candidati||[]).some(c=>c.preferito);
  const acq=(b.candidati||[]).some(c=>c.acquistato);
  return `<article class="bcard" data-act="go" data-route="b/${b.id}">
    <div class="art">${icona(iconaPer(b.tipo||b.titolo))}${fav?'<span class="fav">♥</span>':""}</div>
    <div class="body">
      <div class="micro">${esc(b.tipo||"—")}</div>
      <div class="serif" style="font-size:19px;line-height:1.25">${esc(b.titolo)}</div>
      <div class="tiny">${esc(nomiAmbienti(b.ambienti)||"nessun ambiente")}</div>
      <div style="flex:1"></div>
      <div class="spread" style="margin-top:8px">
        <div class="small num">${v?eur(num(v.prezzo)):"—"}</div>
        <span class="badge ${acq?"b-acq":st.c}">${acq?"Acquistato":st.l}</span>
      </div>
      ${v&&v._p?`<div class="tiny num">${esc(v.marca||"")} ${esc(v.modello||"")} · ${v._p.toFixed(1)}/10</div>`:""}
    </div>
  </article>`;
}
</script>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   ELENCO BENCHMARK — righe ordinabili
   ════════════════════════════════════════════════════════════════════════ */
function righeBenchmark(){
  const f=S.ui.filtro; const out=[];
  for(const b of S.benchmarks){
    const cands=classifica(b);
    const scelti=cands.filter(c=>c.preferito||c.acquistato);
    const mostra=scelti.length?scelti:cands.slice(0,1);
    for(const c of (mostra.length?mostra:[{nome:b.titolo}])){
      const rank=cands.findIndex(x=>x.id===c.id);
      out.push({
        bid:b.id, cid:c.id, titolo:b.titolo, tipo:b.tipo||"",
        marca:[c.marca,c.modello].filter(Boolean).join(" ")||c.nome||"—",
        anno:c.anno?Number(c.anno):null, classe:c.classeEnergetica||"",
        costo:num(c.prezzo), rank:rank>=0?rank+1:null, tot:cands.length,
        data:b.data||"", ambiente:nomiAmbienti(b.ambienti), amb:b.ambienti||[],
        dove:c.venditore||"", preferito:!!c.preferito, acquistato:!!c.acquistato,
        stato:b.stato||"bozza",
      });
    }
  }
  return out.filter(r=>{
    if(f.fav&&!r.preferito) return false;
    if(f.acq&&!r.acquistato) return false;
    if(f.amb&&!r.amb.includes(f.amb)) return false;
    if(f.q){
      const q=f.q.toLowerCase();
      if(!(r.titolo+" "+r.marca+" "+r.tipo+" "+r.ambiente).toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function vElenco(){
  const f=S.ui.filtro, o=S.ui.ordina;
  const righe=sortBy(righeBenchmark(),o.k,o.d);
  const th=(k,l,extra="")=>`<th class="sortable" data-act="ordina" data-k="${k}" ${extra}>${l}${
    o.k===k?`<span style="opacity:.6"> ${o.d>0?"↑":"↓"}</span>`:""}</th>`;
  return `<div class="wrap"><section class="sec">
    <div class="sec-head">
      <div><div class="micro">Archivio</div>
        <h1 class="display" style="font-size:38px">I tuoi benchmark</h1></div>
      <button class="btn sm" data-act="go" data-route="home">Nuovo benchmark</button>
    </div>

    <div class="row" style="margin-bottom:18px">
      <input id="f-q" placeholder="Cerca prodotto, marca, ambiente…" value="${esc(f.q)}"
        style="max-width:300px" data-act="filtro-q">
      <select id="f-amb" data-act="filtro-amb" style="max-width:210px">
        <option value="">Tutti gli ambienti</option>
        ${S.ambienti.map(a=>`<option value="${a.id}" ${f.amb===a.id?"selected":""}>${esc(a.nome)}</option>`).join("")}
      </select>
      <span class="chip pick ${f.fav?"on":""}" data-act="filtro-fav">♥ Preferiti</span>
      <span class="chip pick ${f.acq?"on":""}" data-act="filtro-acq">✓ Acquistati</span>
      <div class="grow"></div>
      <span class="tiny num">${righe.length} ${righe.length===1?"riga":"righe"}</span>
    </div>

    ${righe.length?`<div class="tscroll"><table>
      <thead><tr>
        ${th("data","Data")}${th("titolo","Prodotto")}${th("marca","Marca / Modello")}
        ${th("anno","Anno")}${th("classe","Classe en.")}${th("costo","Costo")}
        ${th("rank","Rank")}${th("ambiente","Ambiente")}${th("dove","Dove")}
        <th style="width:70px"></th>
      </tr></thead>
      <tbody>${righe.map(r=>`
        <tr class="clickable" data-act="go" data-route="b/${r.bid}">
          <td class="num tiny">${dataIt(r.data)}</td>
          <td><div>${esc(r.titolo)}</div><div class="tiny">${esc(r.tipo)}</div></td>
          <td>${esc(r.marca)}</td>
          <td class="num tiny">${r.anno?esc(r.anno)+(generazioneSuperata(r.anno)?" ⚠":""):"—"}</td>
          <td class="tiny">${esc(r.classe||"—")}</td>
          <td class="num">${eur(r.costo)}</td>
          <td>${r.rank?`<span class="rank ${r.rank===2?"r2":r.rank>2?"r3":""}">${r.rank}</span>
            <span class="tiny num">/${r.tot}</span>`:"—"}</td>
          <td class="small">${esc(r.ambiente||"—")}</td>
          <td class="small">${esc(r.dove||"—")}</td>
          <td style="text-align:right;white-space:nowrap">
            ${r.preferito?'<span style="color:var(--accent)">♥</span>':""}
            ${r.acquistato?'<span style="color:var(--green)">✓</span>':""}
          </td>
        </tr>`).join("")}</tbody>
    </table></div>`:`<div class="empty">${icona("altro")}
      <div style="margin-top:10px">Nessun benchmark corrisponde ai filtri.</div></div>`}
  </section></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   DETTAGLIO BENCHMARK
   ════════════════════════════════════════════════════════════════════════ */
function vDettaglio(r){
  const b=byId(S.benchmarks,r.id);
  if(!b) return `<div class="wrap"><div class="empty">Benchmark non trovato.
    <div style="margin-top:14px"><a href="#/benchmark" class="link">Torna all'elenco</a></div></div></div>`;
  const cands=classifica(b);
  const st=STATI[b.stato]||STATI.bozza;
  const maxP=Math.max(...cands.map(c=>c._p||0),0.001);
  const minPrezzo=Math.min(...cands.map(c=>num(c.prezzo)??Infinity));
  const minTco=Math.min(...cands.map(c=>c._tco||Infinity));

  const col=(fn)=>cands.map(fn).join("");
  const riga=(label,fn,cls="")=>`<tr><td>${label}</td>${cands.map((c,i)=>
    `<td class="${cls}">${fn(c,i)}</td>`).join("")}</tr>`;

  const specKeys=[...new Set(cands.flatMap(c=>(c.specs||[]).map(s=>s.k)))];

  return `<div class="wrap"><section class="sec">
    <div class="row" style="margin-bottom:18px">
      <a href="#/benchmark" class="link">← Benchmark</a>
      <div class="grow"></div>
      <span class="tiny num">#${esc(b.id)} · ${dataIt(b.data)}</span>
    </div>

    <div class="spread" style="align-items:flex-start;margin-bottom:8px">
      <div>
        <div class="micro">${esc(b.tipo||"—")} · ${b.categoria==="servizio"?"Servizio":"Prodotto"}
          · ${b.modelliUtente?"confronto dei tuoi modelli":"ricerca da 3 a 5 candidati"}</div>
        <h1 class="display" style="font-size:clamp(30px,5vw,46px);margin-top:6px">${esc(b.titolo)}</h1>
      </div>
      <div class="row-tight">
        <span class="badge ${st.c}">${st.l}</span>
        <button class="btn ghost sm" data-act="edit-bench" data-id="${b.id}">Modifica</button>
      </div>
    </div>

    <div class="row-tight" style="margin:14px 0 6px">
      ${(b.ambienti||[]).map(id=>`<span class="chip">${esc(byId(S.ambienti,id)?.nome||id)}
        <button data-act="rm-amb" data-b="${b.id}" data-id="${id}" title="Rimuovi">×</button></span>`).join("")}
      <span class="chip pick soft" data-act="add-amb" data-b="${b.id}">+ ambiente</span>
      ${b.bonusMobili?'<span class="chip soft">bonus mobili</span>':""}
    </div>

    ${b.esigenza?`<p class="lead" style="max-width:720px;margin-top:14px">${esc(b.esigenza)}</p>`:""}
    ${b.vincoli?`<div class="note" style="margin-top:14px">${esc(b.vincoli)}</div>`:""}

    ${b.stato==="attesa"?`<div class="note" style="margin-top:18px">
      <strong>In coda per la ricerca reale.</strong>
      ${b.modelliUtente?"Verificherò i modelli che hai indicato":"Cercherò da 3 a 5 "+
        (b.categoria==="servizio"?"fornitori":"prodotti")}, con prezzo, anno di uscita,
      classe energetica e fonti dichiarate.
      <br>Il servizio è a richiesta: niente gira in background. Apri una sessione e scrivi
      <strong>«esegui la coda»</strong> quando vuoi i risultati.</div>`:""}

    ${cands.some(c=>generazioneSuperata(c.anno))?`<div class="note warn" style="margin-top:18px">
      <strong>Attenzione:</strong> ${cands.filter(c=>generazioneSuperata(c.anno)).length} candidati sono
      di almeno due generazioni fa. Siamo nel ${ANNO_CORRENTE}: verifica se esiste il successore
      a prezzo comparabile prima di decidere.</div>`:""}

    ${cands.length?`
    <div style="margin:28px 0 10px" class="spread">
      <div class="micro micro-ink">Comparativa · ${cands.length} candidati</div>
      <div class="row-tight">
        <button class="btn ghost xs" data-act="job-verifica" data-b="${b.id}">⟳ Verifica prezzi con ricerca reale</button>
        ${b.griglia?"":`<button class="btn ghost xs" data-act="griglia" data-b="${b.id}">Griglia</button>`}
        <button class="btn ghost xs" data-act="add-cand" data-b="${b.id}">+ candidato</button>
      </div>
    </div>
    <div class="tscroll"><table class="cmp">
      <thead><tr><th></th>${cands.map((c,i)=>`<th>
        <div class="row-tight" style="margin-bottom:4px">
          <span class="rank ${i===1?"r2":i>1?"r3":""}">${i+1}</span>
          ${c.preferito?'<span style="color:var(--accent)">♥</span>':""}
          ${c.acquistato?'<span style="color:var(--green)">✓</span>':""}
        </div>
        <div class="cand-head">${esc(c.marca||"")} ${esc(c.modello||c.nome||"")}</div>
        ${c.anno?`<div class="tiny num" style="margin-top:3px${generazioneSuperata(c.anno)
          ?";color:var(--danger)":""}">${esc(c.anno)}${c.classeEnergetica
          ?" · classe "+esc(c.classeEnergetica):""}</div>`:""}
      </th>`).join("")}</tr></thead>
      <tbody>
        <tr><td>Punteggio</td>${cands.map(c=>`<td class="${c._p&&c._p>=maxP?"best":""}">
          <span class="num" style="font-size:16px">${c._p?c._p.toFixed(1):"—"}</span>
          ${c._p?`<div class="score-bar"><i style="width:${c._p*10}%"></i></div>`:""}
        </td>`).join("")}</tr>
        ${riga("Prezzo",c=>{const p=num(c.prezzo);
          return `<span class="num ${p===minPrezzo?"":""}">${eur(p)}</span>`})}
        ${riga("Anno di uscita",c=>c.anno
          ?`<span class="num">${esc(c.anno)}</span>${generazioneSuperata(c.anno)
            ?' <span class="badge b-err" style="margin-left:4px">superato</span>':""}`
          :'<span class="tiny">da verificare</span>')}
        ${riga("Classe energetica",c=>c.classeEnergetica
          ?esc(c.classeEnergetica):'<span class="tiny">da verificare</span>')}
        ${riga("TCO 10 anni",c=>`<span class="num">${c._tco?eur(c._tco):"—"}</span>`)}
        ${riga("Venditore",c=>esc(c.venditore||"—"))}
        <tr><td colspan="${cands.length+1}" style="background:var(--sand);padding:7px 14px"
          class="micro">Criteri</td></tr>
        ${CRITERI.map(cr=>riga(cr.label,c=>{
          const v=c.punteggi?.[cr.k];
          return v==null||v===""?"—":`<span class="num">${v}</span><span class="tiny">/10</span>`;
        })).join("")}
        ${specKeys.length?`<tr><td colspan="${cands.length+1}" style="background:var(--sand);padding:7px 14px"
          class="micro">Specifiche</td></tr>`:""}
        ${specKeys.map(k=>riga(esc(k),c=>{
          const s=(c.specs||[]).find(x=>x.k===k); return esc(s?.v||"—");
        })).join("")}
        <tr><td colspan="${cands.length+1}" style="background:var(--sand);padding:7px 14px"
          class="micro">Giudizio</td></tr>
        ${riga("Pro",c=>(c.pro||[]).map(p=>`<div class="tiny">+ ${esc(p)}</div>`).join("")||"—")}
        ${riga("Contro",c=>(c.contro||[]).map(p=>`<div class="tiny">− ${esc(p)}</div>`).join("")||"—")}
        ${riga("Garanzia",c=>c.garanziaMesi?esc(c.garanziaMesi)+" mesi":"—")}
        <tr><td colspan="${cands.length+1}" style="background:var(--sand);padding:7px 14px"
          class="micro">Azioni</td></tr>
        <tr><td>Preferito / Acquistato</td>${cands.map(c=>`<td>
          <div class="row-tight">
            <button class="btn ${c.preferito?"":"ghost"} xs" data-act="fav" data-b="${b.id}" data-c="${c.id}">
              ${c.preferito?"♥":"♡"}</button>
            <button class="btn ${c.acquistato?"":"ghost"} xs" data-act="acq" data-b="${b.id}" data-c="${c.id}">
              ${c.acquistato?"✓ preso":"acquistato"}</button>
          </div></td>`).join("")}</tr>
        <tr><td>Cerca online</td>${cands.map(c=>`<td>
          <div class="stack" style="--gap:6px">
            <a class="link q" href="${qNegozi(c)}" target="_blank" rel="noopener">Cerca dove acquistare</a><br>
            <a class="link q" href="${qDove(c)}" target="_blank" rel="noopener">Confronta prezzi</a><br>
            <a class="link q" href="${qRecensioni(c)}" target="_blank" rel="noopener">Cerca info e recensioni</a>
          </div></td>`).join("")}</tr>
        <tr><td>Tuoi link</td>${cands.map(c=>`<td>
          ${(c.link||[]).map((l,i)=>`<div class="tiny" style="margin-bottom:4px">
            <a href="${esc(l)}" target="_blank" rel="noopener" style="text-decoration:underline">
              ${esc(l.replace(/^https?:\/\/(www\.)?/,"").slice(0,28))}…</a>
            <button class="chip" style="border:0;padding:0 4px" data-act="rm-link"
              data-b="${b.id}" data-c="${c.id}" data-i="${i}">×</button></div>`).join("")}
          <button class="link q" data-act="add-link" data-b="${b.id}" data-c="${c.id}">+ aggiungi link</button>
        </td>`).join("")}</tr>
        <tr><td>Scheda</td>${cands.map(c=>`<td>
          <button class="link q" data-act="edit-cand" data-b="${b.id}" data-c="${c.id}">Apri e modifica</button>
        </td>`).join("")}</tr>
      </tbody>
    </table></div>

    ${cands.some(c=>c.fonti?.length)?`<div class="card flat" style="margin-top:18px">
      <div class="micro">Fonti dichiarate</div>
      <div class="tiny" style="margin-top:8px">${cands.flatMap(c=>c.fonti||[])
        .filter((v,i,a)=>a.indexOf(v)===i).map(esc).join(" · ")}</div></div>`:""}
    `:`<div class="empty" style="border:1px solid var(--line);border-radius:2px;margin-top:24px">
      ${icona(iconaPer(b.tipo||b.titolo))}
      <div style="margin-top:12px">Nessun candidato ancora.</div>
      <div class="tiny" style="max-width:440px;margin:8px auto 0">
        ${b.modelliUtente
          ? "Confronterò i modelli che hai indicato, verificandone prezzo, anno e classe energetica."
          : "Cercherò da 3 a 5 "+(b.categoria==="servizio"?"fornitori":"prodotti")+
            " che rispondono a questa esigenza, sul mercato italiano di oggi."}
        <br>I nomi arrivano solo dalla ricerca reale: il modello di questa pagina non naviga
        e i cataloghi che ricorda sono di due o tre generazioni fa.</div>
      <div class="row" style="justify-content:center;margin-top:18px">
        <button class="btn sm" data-act="job-verifica" data-b="${b.id}">
          ${b.modelliUtente?"Verifica questi modelli":"Trovami da 3 a 5 candidati"}</button>
        ${AI.pronto?`<button class="btn ghost sm" data-act="griglia" data-b="${b.id}">Prepara la griglia</button>`:""}
        <button class="btn ghost sm" data-act="add-cand" data-b="${b.id}">Aggiungi a mano</button>
      </div></div>`}
    ${grigliaHTML(b.griglia)}

    <div style="margin-top:44px">
      <div class="sec-head"><h2 class="display" style="font-size:26px">Domande su questo benchmark</h2>
        <span class="tiny">${(b.chat||[]).length} messaggi salvati</span></div>
      ${chatHTML("bench:"+b.id,"chat-embed")}
    </div>
  </section></div>`;
}
</script>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   AMBIENTI
   ════════════════════════════════════════════════════════════════════════ */
function vAmbienti(){
  return `<div class="wrap"><section class="sec">
    <div class="sec-head">
      <div><div class="micro">La casa</div>
        <h1 class="display" style="font-size:38px">Ambienti</h1></div>
      <button class="btn sm" data-act="add-ambiente">Nuovo ambiente</button>
    </div>
    <p class="lead" style="max-width:680px;margin-bottom:28px">
      Un benchmark può appartenere a più ambienti. Rinomina, aggiungi o elimina:
      i tag sui benchmark si aggiornano ovunque.</p>

    <div class="grid g2">${S.ambienti.map(a=>{
      const prod=prodottiDiAmbiente(a.id);
      const spesa=prod.reduce((s,p)=>s+(p.v?.acquistato?(num(p.v.prezzoPagato)??num(p.v.prezzo)??0):0),0);
      return `<div class="card">
        <div class="spread" style="align-items:flex-start">
          <div>
            <div class="serif" style="font-size:22px">${esc(a.nome)}</div>
            <div class="tiny">${esc(a.note||"")}</div>
          </div>
          <div class="row-tight">
            <button class="link q" data-act="edit-ambiente" data-id="${a.id}">Modifica</button>
            <button class="link q" style="color:var(--danger)" data-act="del-ambiente" data-id="${a.id}">Elimina</button>
          </div>
        </div>
        <div class="row" style="margin-top:14px;gap:18px">
          <div><div class="micro">Prodotti</div><div class="num">${prod.length}</div></div>
          <div><div class="micro">Acquistato</div><div class="num">${eur(spesa)}</div></div>
          ${a.budget?`<div><div class="micro">Budget</div><div class="num">${eur(num(a.budget))}</div></div>`:""}
        </div>
        ${prod.length?`<div style="margin-top:14px;border-top:1px solid var(--line2);padding-top:6px">
          ${prod.slice(0,6).map(p=>`<div class="lrow" style="padding:9px 0;cursor:pointer"
            data-act="go" data-route="b/${p.b.id}">
            <div class="grow"><div class="small">${esc(p.b.titolo)}</div>
              <div class="tiny">${esc([p.v?.marca,p.v?.modello].filter(Boolean).join(" ")||"nessun candidato")}</div></div>
            <div class="tiny num">${p.v?eur(num(p.v.prezzo)):"—"}</div>
            ${p.v?.acquistato?'<span style="color:var(--green)">✓</span>':p.v?.preferito?'<span style="color:var(--accent)">♥</span>':""}
          </div>`).join("")}
          ${prod.length>6?`<div class="tiny" style="padding-top:6px">+ altri ${prod.length-6}</div>`:""}
        </div>`:`<div class="tiny" style="margin-top:14px">Nessun prodotto associato.</div>`}
      </div>`}).join("")}</div>
  </section></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   ACQUISTI
   ════════════════════════════════════════════════════════════════════════ */
function vAcquisti(){
  const righe=[];
  for(const b of S.benchmarks) for(const c of (b.candidati||[])){
    if(!c.acquistato&&!c.preferito) continue;
    righe.push({b,c,prezzo:num(c.prezzoPagato)??num(c.prezzo),
      stato:c.acquistato?"acquistato":"shortlist"});
  }
  const acq=righe.filter(r=>r.stato==="acquistato");
  const {tot,bonus}=speseTotali();
  const perAmb={};
  for(const r of acq) for(const id of (r.b.ambienti||[]))
    perAmb[id]=(perAmb[id]||0)+(r.prezzo||0);

  return `<div class="wrap"><section class="sec">
    <div class="sec-head">
      <div><div class="micro">Spesa e plafond</div>
        <h1 class="display" style="font-size:38px">Acquisti</h1></div>
    </div>

    <div class="grid g3" style="margin-bottom:32px">
      <div class="card"><div class="micro">Totale acquistato</div>
        <div class="display num" style="font-size:34px;margin-top:6px">${eur(tot)}</div>
        <div class="tiny">${acq.length} ${acq.length===1?"prodotto":"prodotti"}</div></div>
      <div class="card"><div class="micro">Bonus mobili 2026</div>
        <div class="display num" style="font-size:34px;margin-top:6px">${eur(bonus)}</div>
        <div class="meter" style="margin-top:10px"><i class="${bonus>PLAFOND_BONUS?"over":""}"
          style="width:${Math.min(100,bonus/PLAFOND_BONUS*100)}%"></i></div>
        <div class="tiny" style="margin-top:8px">Plafond ${eur(PLAFOND_BONUS)} · detrazione 50% in 10 quote</div></div>
      <div class="card"><div class="micro">In shortlist</div>
        <div class="display num" style="font-size:34px;margin-top:6px">
          ${eur(righe.filter(r=>r.stato==="shortlist").reduce((s,r)=>s+(r.prezzo||0),0))}</div>
        <div class="tiny">${righe.length-acq.length} da confermare</div></div>
    </div>

    ${righe.length?`<div class="tscroll"><table>
      <thead><tr><th>Prodotto</th><th>Marca / Modello</th><th>Ambiente</th><th>Prezzo</th>
        <th>Venditore</th><th>Bonus</th><th>Stato</th></tr></thead>
      <tbody>${sortBy(righe,"stato").map(r=>`<tr class="clickable" data-act="go" data-route="b/${r.b.id}">
        <td>${esc(r.b.titolo)}</td>
        <td>${esc([r.c.marca,r.c.modello].filter(Boolean).join(" ")||r.c.nome||"—")}</td>
        <td class="small">${esc(nomiAmbienti(r.b.ambienti)||"—")}</td>
        <td class="num">${eur(r.prezzo)}</td>
        <td class="small">${esc(r.c.venditore||"—")}</td>
        <td>${r.b.bonusMobili?"sì":"—"}</td>
        <td><span class="badge ${r.stato==="acquistato"?"b-acq":"b-cor"}">
          ${r.stato==="acquistato"?"Acquistato":"Preferito"}</span></td>
      </tr>`).join("")}</tbody></table></div>`
      :`<div class="empty">${icona("altro")}<div style="margin-top:10px">
        Nessun prodotto marcato come preferito o acquistato.</div></div>`}

    ${Object.keys(perAmb).length?`<div style="margin-top:36px">
      <div class="sec-head"><h2 class="display" style="font-size:24px">Spesa per ambiente</h2></div>
      <div class="card">${Object.entries(perAmb).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`
        <div class="lrow"><div class="grow">${esc(byId(S.ambienti,id)?.nome||id)}</div>
          <div class="num">${eur(v)}</div></div>`).join("")}</div></div>`:""}

    <div class="note" style="margin-top:28px">
      Bonus mobili: valido su acquisti 2026 collegati a lavori edilizi iniziati dal 1° gennaio 2025
      e comunque prima dell'acquisto, con pagamento tracciabile intestato a chi detrae.
      Trasporto e montaggio rientrano nel tetto. Porte e sanitari no. Verifica con il commercialista.
    </div>
  </section></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   DOCUMENTAZIONE
   ════════════════════════════════════════════════════════════════════════ */
function vDocumenti(){
  const cart=S.ui.cartella;
  const docs=S.documenti.filter(d=>cart==="tutte"||d.cartella===cart)
    .filter(d=>!S.ui.filtroDoc||((d.nome+" "+(d.scheda?.riassunto||"")+" "+(d.scheda?.fornitore||""))
      .toLowerCase().includes(S.ui.filtroDoc.toLowerCase())));
  const conteggio=id=>S.documenti.filter(d=>d.cartella===id).length;

  return `<div class="wrap"><section class="sec">
    <div class="sec-head">
      <div><div class="micro">Archivio di progetto</div>
        <h1 class="display" style="font-size:38px">Documentazione</h1></div>
      <span class="tiny num">${S.documenti.length} file</span>
    </div>

    <div class="sidebar-layout">
      <aside>
        <div class="micro" style="margin-bottom:8px">Cartelle</div>
        <div class="folder ${cart==="tutte"?"on":""}" data-act="cartella" data-id="tutte">
          <span>Tutte</span><span class="tiny num">${S.documenti.length}</span></div>
        ${S.cartelle.map(c=>`<div class="folder ${cart===c.id?"on":""}" data-act="cartella" data-id="${c.id}">
          <span>${esc(c.nome)}</span><span class="tiny num">${conteggio(c.id)}</span></div>`).join("")}
        <button class="link q" style="margin-top:12px" data-act="add-cartella">+ nuova cartella</button>
      </aside>

      <div>
        <div id="dropzone" class="drop" data-act="upload">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.2" style="opacity:.5"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <div style="margin-top:10px;font-size:15px">Trascina qui i file, oppure fai click per aprire
            ${navigator.platform?.toLowerCase().includes("mac")?"il Finder":"Esplora risorse"}</div>
          <div class="tiny" style="margin-top:6px">PDF, immagini, testo, fogli · planimetrie, atti, fatture, preventivi</div>
          <div class="tiny" style="margin-top:4px">${Drive.attivo()
            ? "Il file originale finisce nel tuo Google Drive, in «Casa — Via Raviola 32». Qui restano scheda e link."
            : "L'originale resta sul tuo disco: qui salvo la scheda indicizzata e il link che gli dai."}</div>
        </div>
        <input type="file" id="fileinput" multiple class="hide">

        <div class="row" style="margin:20px 0 14px">
          <input placeholder="Cerca nel contenuto indicizzato…" value="${esc(S.ui.filtroDoc||"")}"
            data-act="filtro-doc" style="max-width:340px">
          <div class="grow"></div>
          <span class="tiny num">${docs.length} in questa vista</span>
        </div>

        ${docs.length?`<div class="tscroll"><table>
          <thead><tr><th>Documento</th><th>Cartella</th><th>Estratto</th><th>Importo</th>
            <th>Data</th><th style="width:40px"></th></tr></thead>
          <tbody>${sortBy(docs,"caricato",-1).map(d=>`<tr>
            <td>
              <div class="row-tight">
                <span style="width:15px;color:var(--muted)">${d.superato?"⊘":"▤"}</span>
                <div><div>${esc(d.nome)}</div>
                  <div class="tiny">${d.dim?(d.dim/1024).toFixed(0)+" KB":""}
                  ${d.superato?" · superato da una versione più recente":""}
                  ${d.stato==="da-indicizzare"?" · da indicizzare":""}</div></div>
              </div>
            </td>
            <td><select data-act="sposta-doc" data-id="${d.id}" style="font-size:12px;padding:5px 24px 5px 8px">
              ${S.cartelle.map(c=>`<option value="${c.id}" ${d.cartella===c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}
            </select></td>
            <td class="small">${esc(d.scheda?.fornitore||d.scheda?.oggetto||d.scheda?.tipo||"—")}</td>
            <td class="num">${d.scheda?.totale?eur(num(d.scheda.totale)):"—"}</td>
            <td class="num tiny">${dataIt(d.scheda?.data||d.caricato)}</td>
            <td style="text-align:right;white-space:nowrap">
              ${d.driveUrl?`<a class="link q" href="${esc(d.driveUrl)}" target="_blank"
                rel="noopener" title="Apri il file su Google Drive">Drive</a><span class="sep">·</span>`
                :d.driveErrore?`<span class="tiny" style="color:var(--danger)" title="${esc(d.driveErrore)}">⚠</span> `:""}
              <button class="link q" data-act="apri-doc" data-id="${d.id}">apri</button></td>
          </tr>`).join("")}</tbody></table></div>`
          :`<div class="empty">${icona("doc")}<div style="margin-top:10px">
            Nessun documento in questa cartella.</div></div>`}

        <div class="note" style="margin-top:22px">
          <strong>Come risparmio token.</strong> Al caricamento estraggo il testo una volta sola e ne
          ricavo una scheda (tipo, fornitore, oggetto, imponibile, IVA, totale, data, riassunto).
          Quando mi chiedi un preventivo leggo la scheda, non il PDF: se me lo richiedi domani
          non rielaboro niente. Il file identico viene scartato, e un preventivo più recente dello
          stesso fornitore manda il precedente in stato «superato», fuori dal contesto della chat.
        </div>
      </div>
    </div>
  </section></div>`;
}

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   CHAT — due superfici, una sola implementazione.
   'globale'      → overlay presente su ogni pagina, non perde il contesto
   'bench:<id>'   → Q&A incorporata, salvata dentro il benchmark
   ════════════════════════════════════════════════════════════════════════ */
const Chat={
  busy:{}, bozze:{}, ctl:{},

  messaggi(scope){
    if(scope==="globale") return S.chatGlobale.messaggi||[];
    const b=byId(S.benchmarks,scope.slice(6));
    return b?(b.chat||[]):[];
  },
  async salva(scope,msgs){
    const tagliati=msgs.slice(-60);
    if(scope==="globale"){
      S.chatGlobale.messaggi=tagliati;
      await Store.set("chat/globale",{messaggi:tagliati});
    }else{
      const b=byId(S.benchmarks,scope.slice(6));
      if(!b) return;
      b.chat=tagliati;
      await Store.set("benchmark/"+b.id,scrivibile(b));
    }
  },

  /* contesto compatto: le schede, mai i documenti interi */
  contesto(scope){
    const L=[];
    L.push("Sei l'assistente del progetto casa di via Raviola 32 a Mezzocammino (Roma).");
    L.push("Rispondi in italiano, diretto, senza adulazione e senza ripetere la domanda.");
    L.push(`Oggi è il ${oggi()}. Siamo nel ${ANNO_CORRENTE}.`);
    L.push("Non hai accesso a internet e la tua data di addestramento è nel passato.");
    L.push("REGOLA VINCOLANTE: non nominare MAI modelli, sigle o prezzi di prodotti");
    L.push("presi dalla tua memoria. I cataloghi che ricordi sono superati di anni.");
    L.push("Se ti chiedono quali prodotti comprare, dillo apertamente e proponi di");
    L.push("mettere il benchmark in coda per la ricerca reale.");
    L.push("Puoi invece parlare liberamente di: criteri, specifiche da confrontare,");
    L.push("compromessi tecnici, domande da chiudere, trappole d'acquisto, e dei");
    L.push("candidati che trovi qui sotto, che provengono da una ricerca verificata.");
    L.push("");
    L.push("AMBIENTI:");
    for(const a of S.ambienti) L.push(`- ${a.nome}${a.note?" ("+a.note+")":""}`);

    if(scope.startsWith("bench:")){
      const b=byId(S.benchmarks,scope.slice(6));
      if(b){
        L.push("","BENCHMARK IN CORSO: "+b.titolo+" — tipo "+(b.tipo||"n.d.")+
          " — ambienti: "+(nomiAmbienti(b.ambienti)||"nessuno"));
        if(b.esigenza) L.push("Esigenza: "+b.esigenza);
        if(b.vincoli) L.push("Vincoli: "+b.vincoli);
        L.push("CANDIDATI:");
        for(const c of classifica(b)){
          L.push(`- ${c.marca||""} ${c.modello||c.nome||""} | prezzo ${c.prezzo||"n.d."} | `+
            `punteggio ${c._p?c._p.toFixed(1):"n.d."} | venditore ${c.venditore||"n.d."}`+
            (c.preferito?" | PREFERITO":"")+(c.acquistato?" | ACQUISTATO":""));
          for(const s of (c.specs||[]).slice(0,6)) L.push(`    ${s.k}: ${s.v}`);
          if(c.pro?.length) L.push("    pro: "+c.pro.join("; "));
          if(c.contro?.length) L.push("    contro: "+c.contro.join("; "));
          if(c.link?.length) L.push("    link forniti dall'utente: "+c.link.join(" "));
        }
      }
    }else{
      L.push("","BENCHMARK ARCHIVIATI:");
      for(const b of sortBy(S.benchmarks,"data",-1).slice(0,40)){
        const v=vincitore(b);
        L.push(`- ${b.titolo} (${b.tipo||"n.d."}, ${nomiAmbienti(b.ambienti)||"—"}, ${b.data||""}) `+
          `→ ${v?`${v.marca||""} ${v.modello||""} ${v.prezzo?v.prezzo+" €":""}`:"nessun candidato"}`+
          (v?.acquistato?" [acquistato]":v?.preferito?" [preferito]":""));
      }
      const docs=S.documenti.filter(d=>!d.superato);
      if(docs.length){
        L.push("","SCHEDE DEI DOCUMENTI (già estratte: usa queste, non chiedere di rileggere i file):");
        for(const d of docs.slice(0,60)){
          const s=d.scheda||{};
          L.push(`- [${d.id}] ${d.nome} | cartella ${carNome(d.cartella)}`+
            (d.driveUrl?" | su Drive":"")+` | tipo ${s.tipo||"n.d."}`+
            ` | fornitore ${s.fornitore||"n.d."} | oggetto ${s.oggetto||"n.d."}`+
            ` | totale ${s.totale||"n.d."} | data ${s.data||d.caricato||"n.d."}`);
          if(s.riassunto) L.push("    "+String(s.riassunto).slice(0,220));
        }
        L.push("Se serve il testo integrale di un documento, dillo indicando il suo [id]: te lo apro io.");
      }
      const {tot,bonus}=speseTotali();
      L.push("",`SPESA: acquistato ${tot} € — di cui in bonus mobili ${bonus} € su un plafond di ${PLAFOND_BONUS} €.`);
    }
    let t=L.join("\n");
    if(t.length>14000) t=t.slice(0,14000)+"\n[…contesto troncato]";
    return t;
  },

  async invia(scope){
    const testo=(this.bozze[scope]||"").trim();
    if(!testo||this.busy[scope]) return;
    const msgs=[...this.messaggi(scope),{r:"me",t:testo,d:new Date().toISOString()}];
    this.bozze[scope]=""; this.busy[scope]=true;
    await this.salva(scope,msgs); renderChat();

    if(!AI.pronto){
      this.busy[scope]=false;
      await this.salva(scope,[...msgs,{r:"err",t:"Il modello non è raggiungibile in questa vista.",d:new Date().toISOString()}]);
      renderChat(); return;
    }
    const turni=[{role:"user",content:this.contesto(scope)}];
    for(const m of msgs.slice(-14)){
      if(m.r==="err") continue;
      turni.push({role:m.r==="me"?"user":"assistant",content:m.t});
    }
    if(turni[turni.length-1].role!=="user") turni.push({role:"user",content:testo});

    const ctl=new AbortController(); this.ctl[scope]=ctl;
    let parziale="";
    try{
      const t=await AI.testo(turni,{tier:S.cfg.tier,signal:ctl.signal,
        onText:({text})=>{ parziale=text; const body=document.querySelector(`[data-chatbody="${scope}"]`);
          if(body){ const last=body.querySelector(".streaming");
            if(last){ last.innerHTML=md(text); body.scrollTop=body.scrollHeight } } }});
      this.busy[scope]=false;
      await this.salva(scope,[...msgs,{r:"ai",t,d:new Date().toISOString()}]);
    }catch(e){
      this.busy[scope]=false;
      const keep=e?.text||parziale;
      const add=[...msgs];
      if(keep) add.push({r:"ai",t:keep,d:new Date().toISOString()});
      if(e?.code!=="cancelled") add.push({r:"err",t:AI.copy(e),d:new Date().toISOString()});
      await this.salva(scope,add);
    }
    renderChat();
  },
};
const carNome=id=>byId(S.cartelle,id)?.nome||id||"—";

function chatHTML(scope,cls=""){
  const msgs=Chat.messaggi(scope);
  const busy=Chat.busy[scope];
  const glob=scope==="globale";
  return `<div class="chat ${cls}" data-chat="${scope}">
    <div class="chat-head">
      <div class="row-tight">
        <span class="micro micro-ink">${glob?"Assistente casa":"Q&A benchmark"}</span>
      </div>
      <div class="row-tight">
        <select data-act="tier-sel" style="font-size:11px;padding:4px 22px 4px 8px;width:auto;border-color:transparent;background:transparent">
          <option value="quick" ${S.cfg.tier==="quick"?"selected":""}>Rapido</option>
          <option value="default" ${S.cfg.tier==="default"?"selected":""}>Standard</option>
          <option value="complex" ${S.cfg.tier==="complex"?"selected":""}>Approfondito</option>
        </select>
        ${glob?`<button class="iconbtn" style="width:28px;height:28px" data-act="chiudi-chat" aria-label="Chiudi">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5L5 19"/></svg></button>`:""}
      </div>
    </div>
    <div class="chat-body" data-chatbody="${scope}">
      ${msgs.length?msgs.map(m=>{
        if(m.r==="me") return `<div class="msg me">${esc(m.t)}</div>`;
        if(m.r==="err") return `<div class="msg err">${esc(m.t)}</div>`;
        return `<div class="msg ai"><div class="who">Claude</div>${md(m.t)}</div>`;
      }).join(""):`<div class="tiny" style="margin:auto;text-align:center;max-width:260px">
        ${glob?"Chiedimi di cercare un documento, il totale di un preventivo, o cosa manca in un ambiente."
              :"Chiedimi di approfondire i candidati: differenze reali, difetti ricorrenti, cosa verificare prima di comprare."}
        <br><br>Le risposte restano salvate qui.</div>`}
      ${busy?`<div class="msg ai"><div class="who">Claude</div>
        <div class="streaming"><span class="typing"><i></i><i></i><i></i></span></div></div>`:""}
    </div>
    <div class="chat-foot">
      <div class="row">
        <textarea class="grow" data-act="chat-input" data-scope="${scope}" rows="1"
          style="min-height:42px;max-height:130px;padding:10px 12px"
          placeholder="Scrivi una domanda…">${esc(Chat.bozze[scope]||"")}</textarea>
        ${busy?`<button class="btn ghost sm" data-act="stop-chat" data-scope="${scope}">Stop</button>`
              :`<button class="btn sm" data-act="chat-send" data-scope="${scope}">Invia</button>`}
      </div>
    </div>
  </div>`;
}

function renderChat(){
  const m=$("#chatmount");
  const emb=document.querySelector('[data-chat^="bench:"]');
  if(emb){
    const scope=emb.getAttribute("data-chat");
    const nuovo=document.createElement("div"); nuovo.innerHTML=chatHTML(scope,"chat-embed");
    emb.replaceWith(nuovo.firstElementChild);
    const b=document.querySelector(`[data-chatbody="${scope}"]`); if(b) b.scrollTop=b.scrollHeight;
  }
  if(S.ui.chatAperta){
    m.innerHTML=`<div class="overlay-chat">${chatHTML("globale")}</div>`;
    const b=document.querySelector('[data-chatbody="globale"]'); if(b) b.scrollTop=b.scrollHeight;
  }else{
    const n=Chat.messaggi("globale").length;
    m.innerHTML=`<button class="fab" data-act="apri-chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.3 9.3 0 0 1-3-.5L4 21l1.6-4.4A8.2 8.2 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/></svg>
      Chiedi${n?` · ${n}`:""}</button>`;
  }
}
</script>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   PERSISTENZA ENTITÀ + MODALI
   ════════════════════════════════════════════════════════════════════════ */
const scrivibile=o=>{const c=clone(o); delete c.id; return c};

async function salvaBench(b){
  const i=S.benchmarks.findIndex(x=>x.id===b.id);
  if(i<0) S.benchmarks.push(b); else S.benchmarks[i]=b;
  await Store.set("benchmark/"+b.id,scrivibile(b));
}
async function salvaDoc(d){
  const i=S.documenti.findIndex(x=>x.id===d.id);
  if(i<0) S.documenti.push(d); else S.documenti[i]=d;
  await Store.set("documenti/"+d.id,scrivibile(d));
}
async function nuovoJob(tipo,payload){
  const j={id:uid(),tipo,stato:"nuovo",creato:new Date().toISOString(),...payload};
  S.coda.push(j); await Store.set("coda/"+j.id,scrivibile(j)); return j;
}

/* ---- modale generica ---- */
let _modaleSalva=null;
function modale({titolo,campi,salva,nota}){
  _modaleSalva=salva;
  $("#modalmount").innerHTML=`<div class="scrim" data-act="chiudi-modale-bg">
    <div class="modal">
      <div class="modal-head">
        <div class="serif" style="font-size:21px">${esc(titolo)}</div>
        <button class="iconbtn" data-act="chiudi-modale" aria-label="Chiudi">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      </div>
      <div class="modal-body stack" style="--gap:16px">
        ${nota?`<div class="note">${nota}</div>`:""}
        ${campi.map(c=>campoHTML(c)).join("")}
        <div class="row" style="justify-content:flex-end;padding-top:8px">
          <button class="btn ghost sm" data-act="chiudi-modale">Annulla</button>
          <button class="btn sm" data-act="salva-modale">Salva</button>
        </div>
      </div>
    </div></div>`;
  const f=$("#modalmount input,#modalmount textarea"); if(f) f.focus();
}
function campoHTML(c){
  if(c.tipo==="hr") return '<hr>';
  if(c.tipo==="titolo") return `<div class="micro" style="margin-top:6px">${esc(c.label)}</div>`;
  const id="mf-"+c.k;
  if(c.tipo==="area") return `<label class="field"><span>${esc(c.label)}</span>
    <textarea id="${id}" data-mf="${c.k}" placeholder="${esc(c.ph||"")}" rows="${c.rows||3}">${esc(c.val??"")}</textarea>
    ${c.hint?`<span class="tiny">${esc(c.hint)}</span>`:""}</label>`;
  if(c.tipo==="select") return `<label class="field"><span>${esc(c.label)}</span>
    <select id="${id}" data-mf="${c.k}">${c.opz.map(o=>
      `<option value="${esc(o[0])}" ${String(c.val)===String(o[0])?"selected":""}>${esc(o[1])}</option>`).join("")}</select></label>`;
  if(c.tipo==="multi") return `<div class="field"><span>${esc(c.label)}</span>
    <div class="row-tight" data-mf-multi="${c.k}">${c.opz.map(o=>
      `<span class="chip pick ${(c.val||[]).includes(o[0])?"on":""}" data-act="mf-multi"
        data-k="${c.k}" data-v="${esc(o[0])}">${esc(o[1])}</span>`).join("")}</div></div>`;
  if(c.tipo==="check") return `<label class="row" style="cursor:pointer">
    <input type="checkbox" id="${id}" data-mf="${c.k}" ${c.val?"checked":""} style="width:16px;height:16px;padding:0">
    <span class="small">${esc(c.label)}</span></label>`;
  return `<label class="field"><span>${esc(c.label)}</span>
    <input id="${id}" data-mf="${c.k}" value="${esc(c.val??"")}" placeholder="${esc(c.ph||"")}"
      ${c.tipo==="num"?'inputmode="decimal"':""}>
    ${c.hint?`<span class="tiny">${esc(c.hint)}</span>`:""}</label>`;
}
function leggiModale(){
  const out={};
  document.querySelectorAll("#modalmount [data-mf]").forEach(el=>{
    out[el.dataset.mf]=el.type==="checkbox"?el.checked:el.value;
  });
  document.querySelectorAll("#modalmount [data-mf-multi]").forEach(el=>{
    out[el.dataset.mfMulti]=[...el.querySelectorAll(".chip.on")].map(c=>c.dataset.v);
  });
  return out;
}
const chiudiModale=()=>{ $("#modalmount").innerHTML=""; _modaleSalva=null };

/* ---- modali specifiche ---- */
function modaleBench(b){
  modale({titolo:b?"Modifica benchmark":"Nuovo benchmark",campi:[
    {k:"titolo",label:"Titolo",val:b?.titolo,ph:"TV 55 pollici soggiorno"},
    {k:"tipo",label:"Tipologia prodotto",val:b?.tipo,ph:"TV, Divano, Frigorifero, Imbianchino…"},
    {k:"categoria",label:"Natura",tipo:"select",val:b?.categoria||"prodotto",
      opz:[["prodotto","Prodotto"],["servizio","Servizio"]]},
    {k:"ambienti",label:"Ambienti",tipo:"multi",val:b?.ambienti||[],
      opz:S.ambienti.map(a=>[a.id,a.nome])},

   Il modello raggiungibile da questa pagina non naviga e ha una data di

   vecchi di due o tre generazioni. Successo apparente, risposta inutile.

async function preparaGriglia(b){
  if(!AI.pronto) return toast("Modello non disponibile in questa vista");
  S.ui.busy=true; render();
  const p=`Sei un consulente d'acquisto per la ristrutturazione di un appartamento a Roma.

IMPORTANTE: NON nominare modelli, marche o prezzi di prodotti specifici. La tua data
di addestramento è nel passato e i cataloghi che ricordi sono superati: siamo nel
${ANNO_CORRENTE}. Nominare prodotti produrrebbe consigli sbagliati. I nomi li fornirà
una ricerca web reale, in un secondo momento.

Il tuo compito è preparare la GRIGLIA con cui valutare i candidati quando arriveranno.

RICHIESTA: ${b.titolo}
TIPOLOGIA: ${b.tipo||"non specificata"}
NATURA: ${b.categoria==="servizio"?"servizio":"prodotto"}
AMBIENTI: ${nomiAmbienti(b.ambienti)||"non specificati"}
ESIGENZA: ${b.esigenza||"non specificata"}
VINCOLI: ${b.vincoli||"nessuno dichiarato"}
BUDGET MASSIMO: ${b.budget?b.budget+" €":"non specificato"}

Rispondi SOLO con questo JSON, nessun testo attorno:
{"specifiche":[{"k":"","perche":""}],
 "domande":[""],
 "trappole":[""],
 "fasce":[{"fascia":"","da":0,"a":0,"cosaCambia":""}],
 "fonti":[""]}

specifiche: massimo 8 caratteristiche da confrontare riga per riga, con in "perche"
  una frase su perché conta PER QUESTO caso specifico, non in generale.
  Includi sempre anno di uscita, e la classe energetica se consuma corrente.
domande: massimo 5 cose che l'utente deve chiarire prima di comprare
  (misure da rilevare, abitudini d'uso, vincoli d'impianto).
trappole: massimo 4 errori tipici di chi compra questa categoria.
fasce: 2 o 3 fasce di prezzo indicative in euro, con cosa cambia davvero salendo.
fonti: massimo 4 tipi di fonte da consultare nella ricerca reale, in ordine di
  affidabilità. Massimo 130 caratteri per campo di testo.`;
  try{
    const g=await AI.json(p,{tier:"default"});
    b.griglia={...g,generata:oggi()};
    await salvaBench(b);
    toast("Griglia pronta. I prodotti arrivano con la ricerca reale.",4000);
  }catch(e){ toast(AI.copy(e),5000) }
  S.ui.busy=false; render();
}

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   DOCUMENTI — lettura, indicizzazione, controllo aggiornamenti
   Il testo si estrae UNA volta. La scheda si calcola UNA volta.
   La chat legge la scheda, non il file: le richieste ripetute costano zero.
   ════════════════════════════════════════════════════════════════════════ */
let _pdfjs=null;
async function pdfLib(){
  if(_pdfjs!==null) return _pdfjs;
  try{
    await new Promise((ok,ko)=>{
      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload=ok; s.onerror=ko; document.head.appendChild(s);
      setTimeout(ko,12000);
    });
    if(window.pdfjsLib){
      try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" }catch{}
      _pdfjs=window.pdfjsLib;
    }else _pdfjs=false;
  }catch{ _pdfjs=false }
  return _pdfjs;
}
async function estraiTesto(file,buf){
  const n=file.name.toLowerCase();
  if(/\.(txt|md|csv|json|log)$/.test(n)) return new TextDecoder().decode(buf).slice(0,120000);
  if(/\.pdf$/.test(n)||file.type==="application/pdf"){
    const lib=await pdfLib(); if(!lib) return null;
    try{
      const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;
      let t="";
      for(let i=1;i<=Math.min(doc.numPages,40);i++){
        const pg=await doc.getPage(i);
        const c=await pg.getTextContent();
        t+=c.items.map(x=>x.str).join(" ")+"\n";
        if(t.length>120000) break;
      }
      return t.trim()||null;
    }catch(e){ console.warn("pdf:",e); return null }
  }
  return null;
}
async function schedaDa(testo,nomeFile){
  if(!AI.pronto||!testo) return null;
  const p=`Estrai i dati da questo documento di un progetto di ristrutturazione casa.
Rispondi SOLO con un oggetto JSON, nessun testo attorno. Non inventare: se un dato
non c'è, usa stringa vuota o 0.

{"tipo":"","fornitore":"","oggetto":"","imponibile":0,"iva":0,"totale":0,
 "data":"AAAA-MM-GG","scadenza":"","riferimenti":"","riassunto":"","chiavi":[""]}

tipo: uno fra preventivo, fattura, planimetria, atto, contratto, scheda tecnica, altro.
oggetto: cosa riguarda, massimo 90 caratteri.
riassunto: 3 righe, massimo 300 caratteri, i numeri che contano.
chiavi: massimo 8 parole chiave per la ricerca.

NOME FILE: ${nomeFile}
CONTENUTO (troncato):
${testo.slice(0,22000)}`;
  try{ return await AI.json(p,{tier:"quick"}) }catch(e){ console.warn("scheda:",e?.code); return null }
}
function normalizza(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim() }

async function gestisciFile(files){
  if(!files||!files.length) return;
  const cart=S.ui.cartella==="tutte"?(S.cartelle[0]?.id||"altro"):S.ui.cartella;
  let nuovi=0,dupli=0,superati=0,suDrive=0,errDrive=null;
  for(const file of files){
    if(file.size>25*1024*1024){ toast(`"${file.name}" supera 25 MB: caricalo su Drive e incolla il link`,5000); continue }
    toast(`Leggo ${file.name}…`,4000);
    const buf=await file.arrayBuffer();
    const hash=await sha256(buf);
    if(S.documenti.some(d=>d.hash===hash)){ dupli++; continue }

    const testo=await estraiTesto(file,buf);
    const scheda=await schedaDa(testo,file.name);
    const d={
      id:uid(),nome:file.name,cartella:cart,mime:file.type||"",dim:file.size,
      hash,caricato:new Date().toISOString(),
      stato:testo?(scheda?"indicizzato":"testo-estratto"):"da-indicizzare",
      scheda:scheda||null, superato:false, driveUrl:"",
      testo:testo?testo.slice(0,60000):"",
    };
    /* controllo aggiornamenti: stesso fornitore + stesso oggetto → il più vecchio decade */
    if(scheda?.fornitore&&scheda?.oggetto){
      for(const old of S.documenti){
        if(old.superato||!old.scheda) continue;
        if(normalizza(old.scheda.fornitore)!==normalizza(scheda.fornitore)) continue;
        if(normalizza(old.scheda.oggetto)!==normalizza(scheda.oggetto)) continue;
        const dOld=old.scheda.data||old.caricato, dNew=scheda.data||d.caricato;
        if(String(dNew)>=String(dOld)){ old.superato=true; await salvaDoc(old); superati++ }
        else d.superato=true;
      }
    }
    /* il file originale va nel Drive di Roberto; qui restano scheda, id e link */
    if(Drive.attivo()){
      const up=await Drive.carica(file,buf,cart);
      if(up?.id){ d.driveId=up.id; d.driveUrl=up.url; suDrive++ }
      else if(up?.errore){ d.driveErrore=up.errore; errDrive=up.errore }
    }
    await salvaDoc(d); nuovi++;
    if(!testo) await nuovoJob("indicizza-documento",{ref:d.id,titolo:file.name,
      nota:"Estrazione testo non riuscita nel browser: da elaborare in Claude Code."});
  }
  render();
  toast(`${nuovi} caricati${suDrive?`, ${suDrive} su Drive`:""}`+
    `${dupli?`, ${dupli} duplicati scartati`:""}${superati?`, ${superati} superati`:""}`,4500);
  if(errDrive) setTimeout(()=>toast("Drive: "+errDrive,7000),1200);
}
