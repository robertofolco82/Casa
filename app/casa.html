  "edit-ambiente":el=>{const a=byId(S.ambienti,el.dataset.id);
    modale({titolo:"Modifica ambiente",campi:[
      {k:"nome",label:"Nome",val:a.nome},{k:"note",label:"Note",val:a.note},
      {k:"budget",label:"Budget €",tipo:"num",val:a.budget}],
      salva:async v=>{Object.assign(a,{nome:v.nome,note:v.note,budget:v.budget});
        await Store.set("ambienti/"+a.id,{nome:a.nome,note:a.note,budget:a.budget});
        chiudiModale(); render()}})},
  "del-ambiente":async el=>{
    const a=byId(S.ambienti,el.dataset.id);
    const usi=S.benchmarks.filter(b=>(b.ambienti||[]).includes(a.id)).length;
    if(!confirm(`Eliminare "${a.nome}"?`+(usi?`\n${usi} benchmark perderanno questo tag.`:""))) return;
    for(const b of S.benchmarks) if((b.ambienti||[]).includes(a.id)){
      b.ambienti=b.ambienti.filter(x=>x!==a.id); await salvaBench(b) }
    await Store.del("ambienti/"+a.id);
    S.ambienti=S.ambienti.filter(x=>x.id!==a.id); render()},

  cartella:el=>{S.ui.cartella=el.dataset.id; render()},
  "add-cartella":()=>modale({titolo:"Nuova cartella",campi:[{k:"nome",label:"Nome",ph:"Garanzie"}],
    salva:async v=>{const id=uid(); await Store.set("cartelle/"+id,{nome:v.nome||"Cartella"});
      S.cartelle.push({id,nome:v.nome||"Cartella"}); chiudiModale(); render()}}),
  upload:()=>$("#fileinput")?.click(),
  "apri-doc":el=>apriDoc(el.dataset.id),
  "sposta-doc":async el=>{
    const d=byId(S.documenti,el.dataset.id); const dest=el.value;
    d.cartella=dest; await salvaDoc(d); render();
    if(d.driveId&&Drive.attivo()){
      const r=await Drive.sposta(d.driveId,dest);
      toast(r?.errore?("Spostato qui, ma su Drive no: "+r.errore)
        :("Spostato in "+carNome(dest)+", anche su Drive"),r?.errore?6000:2600);
    }else toast("Spostato in "+carNome(dest));
  },
  "del-job":async el=>{await Store.del("coda/"+el.dataset.id);
    S.coda=S.coda.filter(j=>j.id!==el.dataset.id); render()},

  ordina:el=>{const k=el.dataset.k;
    S.ui.ordina=S.ui.ordina.k===k?{k,d:-S.ui.ordina.d}:{k,d:k==="data"?-1:1}; render()},
  "filtro-fav":()=>{S.ui.filtro.fav=!S.ui.filtro.fav; render()},
  "filtro-acq":()=>{S.ui.filtro.acq=!S.ui.filtro.acq; render()},
  peso:async el=>{await salvaCfg({pesi:{...S.cfg.pesi,[el.dataset.k]:+el.value}}); render()},

  "apri-chat":()=>{S.ui.chatAperta=true; renderChat();
    setTimeout(()=>document.querySelector('[data-scope="globale"]')?.focus(),60)},
  "chiudi-chat":()=>{S.ui.chatAperta=false; renderChat()},
  "chat-send":el=>Chat.invia(el.dataset.scope),
  "stop-chat":el=>{Chat.ctl[el.dataset.scope]?.abort()},

  "mf-multi":el=>{el.classList.toggle("on")},
  "chiudi-modale":chiudiModale,
  "salva-modale":async()=>{ const f=_modaleSalva; if(f) await f(leggiModale()) },

  export:()=>{
    const dump={v:3,esportato:new Date().toISOString(),cfg:S.cfg,ambienti:S.ambienti,
      cartelle:S.cartelle,benchmarks:S.benchmarks,documenti:S.documenti,coda:S.coda,
      chatGlobale:S.chatGlobale};
    const t=JSON.stringify(dump,null,1);
    navigator.clipboard?.writeText(t).then(
      ()=>toast("Backup copiato negli appunti: incollalo in un file su Drive",5000),
      ()=>modale({titolo:"Backup",campi:[{k:"x",label:"Copia questo testo",tipo:"area",rows:14,val:t}],
        salva:async()=>chiudiModale()}));
  },
  import:()=>modale({titolo:"Importa backup",campi:[
    {k:"j",label:"Incolla il JSON esportato",tipo:"area",rows:12}],
    nota:"Unisce i dati: gli elementi con lo stesso identificativo vengono sovrascritti.",
    salva:async v=>{
      let d; try{ d=JSON.parse(v.j) }catch{ return toast("JSON non valido") }
      for(const a of d.ambienti||[]){ await Store.set("ambienti/"+a.id,scrivibile(a)) }
      for(const c of d.cartelle||[]){ await Store.set("cartelle/"+c.id,scrivibile(c)) }
      for(const b of d.benchmarks||[]){ await Store.set("benchmark/"+b.id,scrivibile(b)) }
      for(const x of d.documenti||[]){ await Store.set("documenti/"+x.id,scrivibile(x)) }
      if(d.cfg) await salvaCfg(d.cfg);
      chiudiModale(); await carica(); render(); toast("Backup importato");
    }}),
};

function leggiBozza(){
  const g=id=>document.getElementById(id)?.value;
  S.ui.bozzaQ=g("q-nuovo")??S.ui.bozzaQ;
  S.ui.bozzaModelli=g("q-modelli")??S.ui.bozzaModelli;
  S.ui.bozzaTipo=g("q-tipo")??S.ui.bozzaTipo;
  S.ui.bozzaBudget=g("q-budget")??S.ui.bozzaBudget;
  S.ui.bozzaNatura=g("q-natura")??S.ui.bozzaNatura;
}

/* ─────────── eventi globali ─────────── */
document.addEventListener("click",e=>{
  const scrim=e.target.closest(".scrim");
  if(scrim&&e.target===scrim){ chiudiModale(); return }
  const el=e.target.closest("[data-act]");
  if(!el) return;
  const act=el.dataset.act;
  if(el.tagName==="A"&&el.getAttribute("href")?.startsWith("http")) return;
  if(["chat-input","filtro-q","filtro-amb","filtro-doc","sposta-doc","tier-sel","peso","upload"].includes(act)
     &&["INPUT","SELECT","TEXTAREA"].includes(el.tagName)) return;
  const f=A[act];
  if(f){ e.preventDefault(); f(el,e) }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const f=A[el.dataset.act]; if(f&&["SELECT","INPUT"].includes(el.tagName)) f(el,e);
});
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="chat-input"){ Chat.bozze[el.dataset.scope]=el.value;
    el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,130)+"px"; return }
  if(act==="filtro-q"){ S.ui.filtro.q=el.value; clearTimeout(window._fq);
    window._fq=setTimeout(()=>{const p=el.selectionStart; render();
      const n=document.getElementById("f-q"); if(n){n.focus(); n.setSelectionRange(p,p)}},260); return }
  if(act==="filtro-doc"){ S.ui.filtroDoc=el.value; clearTimeout(window._fd);
    window._fd=setTimeout(()=>{const p=el.selectionStart; render();
      const n=document.querySelector('[data-act="filtro-doc"]'); if(n){n.focus(); n.setSelectionRange(p,p)}},260); return }
  if(act==="filtro-amb"){ S.ui.filtro.amb=el.value; render(); return }
  if(act==="peso"){ A.peso(el); return }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("#modalmount").innerHTML) chiudiModale();
    else if(S.ui.chatAperta){ S.ui.chatAperta=false; renderChat() } }
  const t=e.target;
  if(t?.dataset?.act==="chat-input"&&e.key==="Enter"&&!e.shiftKey){
    e.preventDefault(); Chat.invia(t.dataset.scope) }
  if(t?.id==="q-nuovo"&&e.key==="Enter"){ e.preventDefault(); A["nuovo-benchmark"]() }
});
document.addEventListener("dragover",e=>{
  const d=e.target.closest("#dropzone"); if(!d) return;
  e.preventDefault(); d.classList.add("hot");
});
document.addEventListener("dragleave",e=>{ e.target.closest("#dropzone")?.classList.remove("hot") });
document.addEventListener("drop",e=>{
  const d=e.target.closest("#dropzone"); if(!d) return;
  e.preventDefault(); d.classList.remove("hot");
  gestisciFile([...(e.dataTransfer?.files||[])]);
});
document.addEventListener("change",e=>{
  if(e.target?.id==="fileinput"){ gestisciFile([...e.target.files]); e.target.value="" }
});

/* ─────────── avvio ─────────── */
(async function(){
  $("#view").innerHTML=`<div class="wrap"><div class="empty" style="padding-top:120px">
    <div class="display" style="font-size:34px">Casa</div>
    <div class="tiny" style="margin-top:14px"><span class="spin"></span> apro l'archivio…</div></div></div>`;
  S.ui.route=leggiHash();
  try{ await carica() }catch(e){ console.error(e) }
  render();
  if(Store.backend==="local")
    setTimeout(()=>toast("Archivio locale: i dati restano in questo browser. Esporta il backup.",6000),1200);
})();
